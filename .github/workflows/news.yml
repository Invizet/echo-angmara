# Раз в 30 минут забирает посты t.me/echoesofangmar и кладёт news.json + картинки в ветку `site` (папка news/),
# которую раздаёт GitHub Pages.
# Лаунчер читает оттуда; к Telegram напрямую он не обращается.
name: Новости из Telegram

on:
  schedule:
    - cron: "7,37 * * * *"   # не ровно :00/:30 — в эти минуты очередь GitHub перегружена
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Ветка site
        run: |
          git clone --depth 1 --branch site "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out \
            || { mkdir out && cd out && git init -b site && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать посты
        run: python src/tools/news/fetch_telegram.py --channel echoesofangmar --out out/news --limit 20

      - name: Опубликовать, если изменилось
        working-directory: out
        run: |
          git config user.name  "echo-angmara-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Новости $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin site
